<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sondage Vent - Dienne (Cantal)</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --border-color: #ddd;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        select {
            padding: 8px 16px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            cursor: pointer;
        }
        .grid-container {
            overflow-x: auto;
            max-width: 100%;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        table {
            border-collapse: collapse;
            text-align: center;
            min-width: 800px;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 8px;
            width: 40px;
            height: 40px;
        }
        th {
            background-color: #f8f9fa;
            font-weight: 600;
            font-size: 14px;
        }
        .y-axis {
            text-align: right;
            padding-right: 15px;
            white-space: nowrap;
        }
        .cell-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }
        .arrow {
            display: inline-block;
            font-size: 18px;
            transition: transform 0.3s ease;
        }
        /* Couleurs pour l'intensité du vent */
        .wind-light { color: #2ecc71; }   /* < 15 km/h */
        .wind-mod   { color: #f1c40f; }   /* 15 - 30 km/h */
        .wind-strong{ color: #e67e22; }   /* 30 - 50 km/h */
        .wind-gale  { color: #e74c3c; }   /* > 50 km/h */
        
        #loading {
            margin-top: 20px;
            font-style: italic;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Prévisions des Vents en Altitude - Dienne (Cantal)</h2>
        <label for="model-select">Modèle Météo : </label>
        <select id="model-select">
            <option value="best_match">Meilleure correspondance (Auto)</option>
            <option value="arome_france">AROME (Météo-France - Très HD)</option>
            <option value="icon_d2">ICON-D2 (DWD - HD)</option>
            <option value="gfs_seamless">GFS (NOAA - Global)</option>
        </select>
        <div id="loading">Chargement des données...</div>
    </div>

    <div class="grid-container">
        <table id="wind-grid">
            </table>
    </div>

    <script>
        // Coordonnées pour Dienne, Cantal
        const LAT = 45.193;
        const LON = 2.808;

        // Mapping des altitudes (approximatif) vers les niveaux de pression hPa
        const LEVELS = [
            { alt: "4000m", hpa: "600" },
            { alt: "3000m", hpa: "700" },
            { alt: "2000m", hpa: "800" },
            { alt: "1500m", hpa: "850" },
            { alt: "1000m", hpa: "900" },
            { alt: "500m",  hpa: "950" },
            { alt: "0m",    hpa: "1000" } // ~Niveau de la mer, Dienne est plus haut (1000m), donc les niveaux < 900hPa seront sous terre selon le modèle.
        ];

        const modelSelect = document.getElementById('model-select');
        const windGrid = document.getElementById('wind-grid');
        const loadingDiv = document.getElementById('loading');

        // Génère les chaînes de requête pour l'API
        const windSpeedVars = LEVELS.map(l => `windspeed_${l.hpa}hPa`).join(',');
        const windDirVars = LEVELS.map(l => `winddirection_${l.hpa}hPa`).join(',');

        async function fetchWeatherData(model) {
            loadingDiv.style.display = 'block';
            windGrid.innerHTML = ''; // Clear table

            // URL Open-Meteo
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&hourly=${windSpeedVars},${windDirVars}&models=${model}&forecast_days=1&timezone=Europe%2FBerlin`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                renderGrid(data.hourly);
            } catch (error) {
                console.error("Erreur lors de la récupération des données :", error);
                windGrid.innerHTML = "<tr><td>Erreur de chargement. Veuillez réessayer.</td></tr>";
            } finally {
                loadingDiv.style.display = 'none';
            }
        }

        function getWindColorClass(speed) {
            if (speed < 15) return 'wind-light';
            if (speed < 30) return 'wind-mod';
            if (speed < 50) return 'wind-strong';
            return 'wind-gale';
        }

        function renderGrid(hourlyData) {
            const table = document.createElement('tbody');

            // --- LIGNE D'EN-TÊTE (Heures) ---
            const headerRow = document.createElement('tr');
            headerRow.appendChild(document.createElement('th')); // Coin vide en haut à gauche
            
            // On prend les 24 premières heures
            for (let i = 0; i < 24; i++) {
                const th = document.createElement('th');
                const date = new Date(hourlyData.time[i]);
                th.innerText = `${date.getHours()}h`;
                headerRow.appendChild(th);
            }
            table.appendChild(headerRow);

            // --- LIGNES DE DONNÉES (Altitudes) ---
            LEVELS.forEach(level => {
                const row = document.createElement('tr');
                
                // Cellule Y-Axis (Altitude)
                const thY = document.createElement('th');
                thY.className = 'y-axis';
                thY.innerText = `${level.alt} (${level.hpa}hPa)`;
                row.appendChild(thY);

                // Cellules de données pour chaque heure
                for (let i = 0; i < 24; i++) {
                    const td = document.createElement('td');
                    
                    const speed = Math.round(hourlyData[`windspeed_${level.hpa}hPa`][i]);
                    const direction = hourlyData[`winddirection_${level.hpa}hPa`][i];

                    // Si la donnée est nulle (ex: sous la surface pour certains modèles)
                    if (speed === null || speed === undefined) {
                        td.innerText = "-";
                    } else {
                        // En météo, une direction de 0° (Nord) signifie que le vent vient du nord et va vers le sud.
                        // La flèche (↓) pointe naturellement vers le bas. Une rotation de la valeur de la direction fait pointer la flèche dans le sens du flux.
                        const colorClass = getWindColorClass(speed);
                        td.innerHTML = `
                            <div class="cell-content ${colorClass}">
                                <span class="arrow" style="transform: rotate(${direction}deg);">↓</span>
                                <span>${speed}</span>
                            </div>
                        `;
                    }
                    row.appendChild(td);
                }
                table.appendChild(row);
            });

            windGrid.appendChild(table);
        }

        // Écouteur sur la liste déroulante
        modelSelect.addEventListener('change', (e) => {
            fetchWeatherData(e.target.value);
        });

        // Chargement initial
        fetchWeatherData(modelSelect.value);
    </script>
</body>
</html>
