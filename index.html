<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sondage Aérologique - Dienne</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --border-color: #ddd;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        select {
            padding: 8px 16px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            cursor: pointer;
            margin-top: 10px;
        }
        
        /* Nouveaux styles pour les contrôles de date */
        .date-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        .date-controls button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: #fff;
            color: #2980b9;
            font-weight: bold;
            transition: all 0.2s;
        }
        .date-controls button:hover {
            background-color: #e8f4f8;
            border-color: #2980b9;
        }
        .date-controls h3 {
            margin: 0;
            min-width: 250px;
            text-align: center;
            color: #2c3e50;
            text-transform: capitalize;
        }

        .grid-container {
            overflow-x: auto;
            max-width: 100%;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        table {
            border-collapse: collapse;
            text-align: center;
            min-width: 800px;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 8px;
            width: 45px;
            height: 45px;
        }
        th {
            background-color: #f8f9fa;
            font-weight: 600;
            font-size: 14px;
        }
        .hour-header {
            cursor: pointer;
            color: #2980b9;
            text-decoration: underline;
            transition: background-color 0.2s;
        }
        .hour-header:hover {
            background-color: #e8f4f8;
        }
        .y-axis {
            text-align: right;
            padding-right: 15px;
            white-space: nowrap;
        }
        .cell-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }
        .arrow {
            display: inline-block;
            font-size: 18px;
            transition: transform 0.3s ease;
        }
        
        .wind-light { color: #2ecc71; }
        .wind-mod   { color: #f1c40f; }
        .wind-strong{ color: #e67e22; }
        .wind-gale  { color: #e74c3c; }
        .wind-hurricane { color: #8e44ad; }
        
        #loading {
            margin-top: 10px;
            font-style: italic;
            color: #666;
            height: 20px; /* Evite que la page saute au chargement */
        }

        .chart-container {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: none; 
        }
        #chart-title {
            text-align: center;
            margin-top: 0;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Aérologie & Vents - Dienne (Cantal)</h2>
        <label for="model-select">Modèle Météo : </label>
        <select id="model-select">
            <option value="best_match">Meilleure correspondance</option>
            <option value="arome_france">AROME (Météo-France)</option>
            <option value="icon_d2">ICON-D2 (DWD)</option>
            <option value="gfs_seamless">GFS (NOAA)</option>
        </select>

        <div class="date-controls">
            <button id="btn-prev">◀ Précédent</button>
            <h3 id="current-date-display">Date</h3>
            <button id="btn-next">Suivant ▶</button>
        </div>

        <div id="loading">Chargement des données...</div>
    </div>

    <div class="grid-container">
        <table id="wind-grid"></table>
    </div>

    <div class="chart-container" id="chart-section">
        <h3 id="chart-title">Profil vertical</h3>
        <canvas id="sondageChart"></canvas>
    </div>

    <script>
        const LAT = 45.193;
        const LON = 2.808;

        const LEVELS = [
            { alt: "11800m", hpa: "200" },
            { alt: "10500m", hpa: "250" },
            { alt: "9000m",  hpa: "300" },
            { alt: "7000m",  hpa: "400" },
            { alt: "5500m",  hpa: "500" },
            { alt: "4000m",  hpa: "600" },
            { alt: "3000m",  hpa: "700" },
            { alt: "2000m",  hpa: "800" },
            { alt: "1500m",  hpa: "850" },
            { alt: "1000m",  hpa: "900" },
            { alt: "500m",   hpa: "950" },
            { alt: "0m",     hpa: "1000" }
        ];

        let globalWeatherData = null;
        let sondageChartInstance = null;
        let currentDate = new Date(); // Initialisation à la date du jour

        const modelSelect = document.getElementById('model-select');
        const windGrid = document.getElementById('wind-grid');
        const loadingDiv = document.getElementById('loading');
        const chartSection = document.getElementById('chart-section');
        const chartTitle = document.getElementById('chart-title');
        
        const dateDisplay = document.getElementById('current-date-display');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        const windSpeedVars = LEVELS.map(l => `windspeed_${l.hpa}hPa`).join(',');
        const windDirVars = LEVELS.map(l => `winddirection_${l.hpa}hPa`).join(',');
        const tempVars = LEVELS.map(l => `temperature_${l.hpa}hPa`).join(',');
        const dewVars = LEVELS.map(l => `dewpoint_${l.hpa}hPa`).join(',');

        // Formate la date pour l'affichage UI (ex: "Mercredi 15 Juillet 2026")
        function updateDateDisplay() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            dateDisplay.innerText = currentDate.toLocaleDateString('fr-FR', options);
        }

        // Formate la date pour l'API (AAAA-MM-JJ)
        function getApiDateString(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function fetchWeatherData() {
            const model = modelSelect.value;
            loadingDiv.style.visibility = 'visible';
            windGrid.innerHTML = '';
            chartSection.style.display = 'none';

            const dateStr = getApiDateString(currentDate);

            // Remplacement de forecast_days par start_date et end_date
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&hourly=${windSpeedVars},${windDirVars},${tempVars},${dewVars}&models=${model}&start_date=${dateStr}&end_date=${dateStr}&timezone=Europe%2FBerlin`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.reason);
                }

                globalWeatherData = data.hourly;
                renderGrid(globalWeatherData);
            } catch (error) {
                console.error("Erreur API :", error);
                windGrid.innerHTML = `<tr><td style="color: red; padding: 20px;">Données indisponibles pour cette date (${error.message || "Erreur réseau"}).</td></tr>`;
            } finally {
                loadingDiv.style.visibility = 'hidden';
            }
        }

        // Gestionnaires d'événements pour les boutons de date
        btnPrev.addEventListener('click', () => {
            currentDate.setDate(currentDate.getDate() - 1);
            updateDateDisplay();
            fetchWeatherData();
        });

        btnNext.addEventListener('click', () => {
            currentDate.setDate(currentDate.getDate() + 1);
            updateDateDisplay();
            fetchWeatherData();
        });

        // Mise à jour lors du changement de modèle
        modelSelect.addEventListener('change', () => {
            fetchWeatherData();
        });


        function getWindColorClass(speed) {
            if (speed < 15) return 'wind-light';
            if (speed < 30) return 'wind-mod';
            if (speed < 50) return 'wind-strong';
            if (speed < 100) return 'wind-gale';
            return 'wind-hurricane'; 
        }

        function renderGrid(hourlyData) {
            const table = document.createElement('tbody');
            const headerRow = document.createElement('tr');
            
            const emptyTh = document.createElement('th');
            emptyTh.innerText = "Heure (Cliquez \u2192)";
            emptyTh.style.fontSize = "11px";
            headerRow.appendChild(emptyTh);
            
            for (let i = 0; i < 24; i++) {
                const th = document.createElement('th');
                const date = new Date(hourlyData.time[i]);
                const hourStr = `${date.getHours()}h`;
                
                th.innerText = hourStr;
                th.className = 'hour-header';
                th.title = "Cliquez pour voir le profil vertical complet";
                
                th.onclick = () => drawSondage(i, hourStr);
                
                headerRow.appendChild(th);
            }
            table.appendChild(headerRow);

            LEVELS.forEach(level => {
                const row = document.createElement('tr');
                const thY = document.createElement('th');
                thY.className = 'y-axis';
                thY.innerText = `${level.alt} (${level.hpa}hPa)`;
                row.appendChild(thY);

                for (let i = 0; i < 24; i++) {
                    const td = document.createElement('td');
                    
                    // Sécurité au cas où l'API renvoie des tableaux incomplets
                    if (!hourlyData[`windspeed_${level.hpa}hPa`] || hourlyData[`windspeed_${level.hpa}hPa`][i] === undefined) {
                        td.innerText = "-";
                        row.appendChild(td);
                        continue;
                    }

                    const speed = Math.round(hourlyData[`windspeed_${level.hpa}hPa`][i]);
                    const direction = hourlyData[`winddirection_${level.hpa}hPa`][i];

                    if (speed === null || isNaN(speed)) {
                        td.innerText = "-";
                    } else {
                        const colorClass = getWindColorClass(speed);
                        td.innerHTML = `
                            <div class="cell-content ${colorClass}">
                                <span class="arrow" style="transform: rotate(${direction}deg);">↓</span>
                                <span>${speed}</span>
                            </div>
                        `;
                    }
                    row.appendChild(td);
                }
                table.appendChild(row);
            });

            windGrid.appendChild(table);
        }

        function drawSondage(hourIndex, hourStr) {
            chartSection.style.display = 'block';
            chartTitle.innerText = `Profil vertical troposphérique à ${hourStr} (${dateDisplay.innerText})`;

            const reversedLevels = [...LEVELS].reverse();
            const yLabels = reversedLevels.map(l => `${l.alt} (${l.hpa} hPa)`);
            
            const originalTemperatures = reversedLevels.map(l => {
                const val = globalWeatherData[`temperature_${l.hpa}hPa`][hourIndex];
                return val !== null && val !== undefined ? val : null;
            });
            const originalDewpoints = reversedLevels.map(l => {
                const val = globalWeatherData[`dewpoint_${l.hpa}hPa`][hourIndex];
                return val !== null && val !== undefined ? val : null;
            });

            const SKEW_FACTOR = 0.09; 
            
            const skewedTemperatures = originalTemperatures.map((t, i) => {
                if (t === null) return null;
                const p = parseInt(reversedLevels[i].hpa);
                return t + (1000 - p) * SKEW_FACTOR;
            });

            const skewedDewpoints = originalDewpoints.map((t, i) => {
                if (t === null) return null;
                const p = parseInt(reversedLevels[i].hpa);
                return t + (1000 - p) * SKEW_FACTOR;
            });

            const ctx = document.getElementById('sondageChart').getContext('2d');

            if (sondageChartInstance) {
                sondageChartInstance.destroy();
            }

            sondageChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: yLabels, 
                    datasets: [
                        {
                            label: 'Température (°C)',
                            data: skewedTemperatures,
                            borderColor: '#333', 
                            backgroundColor: '#333',
                            tension: 0, 
                            pointRadius: 0,
                            pointHitRadius: 10,
                            segment: {
                                borderColor: ctx => {
                                    if (ctx.p0DataIndex === undefined || ctx.p1DataIndex === undefined) return '#333';
                                    
                                    const i0 = ctx.p0DataIndex; 
                                    const i1 = ctx.p1DataIndex; 
                                    
                                    const z0 = parseInt(reversedLevels[i0].alt);
                                    const z1 = parseInt(reversedLevels[i1].alt);
                                    
                                    const t0 = originalTemperatures[i0];
                                    const t1 = originalTemperatures[i1];

                                    if (t0 === null || t1 === null) return '#333';

                                    const dz = z1 - z0; 
                                    const dt = t0 - t1; 
                                    
                                    const lapseRate = (dt / dz) * 100;

                                    if (lapseRate < 0.6) return '#2ecc71'; 
                                    if (lapseRate > 0.9) return '#e74c3c'; 
                                    return '#000000'; 
                                }
                            }
                        },
                        {
                            label: 'Point de rosée (°C)',
                            data: skewedDewpoints,
                            borderColor: '#3498db',
                            backgroundColor: '#3498db',
                            borderDash: [5, 5],
                            tension: 0,
                            pointRadius: 0,
                            pointHitRadius: 10
                        }
                    ]
                },
                options: {
                    indexAxis: 'y', 
                    responsive: true,
                    scales: {
                        x: {
                            title: { display: true, text: 'Température de référence à 1000 hPa (°C)' },
                            position: 'bottom',
                            grid: {
                                display: false 
                            }
                        },
                        y: {
                            title: { display: true, text: 'Altitude / Pression' },
                            reverse: true 
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const index = context.dataIndex;
                                    const isTemp = context.datasetIndex === 0;
                                    const realValue = isTemp ? originalTemperatures[index] : originalDewpoints[index];
                                    return realValue !== null 
                                        ? `${context.dataset.label}: ${realValue.toFixed(1)}°C`
                                        : `${context.dataset.label}: N/A`;
                                }
                            }
                        }
                    }
                }
            });
            
            chartSection.scrollIntoView({ behavior: 'smooth' });
        }

        // Lancement initial
        updateDateDisplay();
        fetchWeatherData();
    </script>
</body>
</html>
